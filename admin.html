<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX KEYS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(100% 60% at 50% 0%,#1a0b0d,#08080a 70%);color:#ededed;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:48px 16px}
main{width:min(640px,100%);background:linear-gradient(180deg,rgba(204,17,17,.12),rgba(204,17,17,0) 30%),#101013;border:1px solid rgba(204,17,17,.4);border-radius:16px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.7)}
h1{margin:0;font-size:22px;letter-spacing:.25em;color:#fff}h1 span{color:#CC1111}
h2{font-size:13px;letter-spacing:.2em;color:#CC1111;margin:22px 0 8px}
p.sub{color:#8a8a90;font-size:12px;letter-spacing:.1em}
input,select{width:100%;margin:8px 0;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#08080a;color:#fff;font-size:14px}
button{padding:13px;border-radius:10px;border:none;background:linear-gradient(180deg,#e01414,#8f0b0b);color:#fff;font-weight:800;letter-spacing:.1em;cursor:pointer}
button.ghost{background:#1a1a1e;border:1px solid rgba(255,255,255,.15);padding:6px 10px;font-size:11px}
pre{background:#000;border:1px solid rgba(204,17,17,.25);padding:14px;border-radius:10px;white-space:pre-wrap;word-break:break-all;color:#7dff9b;min-height:44px}
.row{display:flex;gap:8px}.row>*{flex:1}
.krow{display:flex;align-items:center;gap:8px;background:#000;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:12px}
.krow .k{flex:1;font-family:monospace}.ok{color:#7dff9b}.bad{color:#ff5555}.dim{color:#8a8a90}
.krow .acts{display:flex;gap:4px}
#gate{text-align:center;padding:20px 0}#panel{display:none}
.err{color:#ff5555;font-size:13px;min-height:20px}
</style></head>
<body><main>
<div id="gate"><h1>APEX <span>ADMIN</span></h1><p class="sub">ENTER SECRET TO CONTINUE</p>
<input id="s" type="password" placeholder="Admin secret" autocomplete="off">
<button onclick="unlock()">UNLOCK</button><p class="err" id="e"></p></div>
<div id="panel"><h1>APEX <span>KEYS</span></h1><p class="sub">ADMIN PANEL <a href="#" id="lock" style="color:#8a8a90">lock</a></p>
<div class="row"><select id="p"><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="lifetime">Lifetime</option></select>
<input id="c" type="number" value="1" min="1" max="50"></div>
<div class="row"><button onclick="gen()">GENERATE</button><button onclick="load()" class="ghost" style="flex:.6">REFRESH LIST</button></div>
<pre id="o">keys appear here…</pre>
<h2>ACTIVE KEYS</h2><div id="list"></div></div></main>
<script>
const $=id=>document.getElementById(id);
let S='';
async function api(q){const r=await fetch('/api/admin?'+q);return r.json();}
async function unlock(){
  S=$('s').value;
  const j=await api(`secret=${encodeURIComponent(S)}&action=list`);
  if(!j.ok){$('e').textContent='wrong secret';return;}
  $('gate').style.display='none';$('panel').style.display='block';
  renderList(j.keys);
}
$('lock').onclick=()=>{S='';location.reload();};
async function gen(){
  $('o').textContent='working…';
  const j=await api(`secret=${encodeURIComponent(S)}&action=gen&plan=${$('p').value}&count=${$('c').value}`);
  $('o').textContent=j.ok?j.keys.join('\n'):(j.error||'denied');
  if(j.ok)load();
}
async function act(action,key){
  await api(`secret=${encodeURIComponent(S)}&action=${action}&key=${encodeURIComponent(key)}`);
  load();
}
async function load(){
  const j=await api(`secret=${encodeURIComponent(S)}&action=list`);
  if(j.ok)renderList(j.keys);
}
function renderList(keys){
  const box=$('list');box.innerHTML='';
  if(!keys.length){box.innerHTML='<span class="dim">no keys</span>';return;}
  keys.forEach(k=>{
    const exp=k.expires_at?new Date(k.expires_at).toLocaleDateString():'never';
    const d=document.createElement('div');d.className='krow';
    d.innerHTML=`<span class="k ${k.revoked?'bad':'ok'}"></span><span class="dim">${k.plan} · ${exp} · ${k.hwid?'bound':'free'}</span><span class="acts"></span>`;
    d.querySelector('.k').textContent=k.key;
    const a=d.querySelector('.acts');
    [['revoke','BAN'],['unrevoke','UNBAN'],['resethwid','HWID'],['delete','DEL']].forEach(([ac,t])=>{
      const b=document.createElement('button');b.className='ghost';b.textContent=t;
      b.onclick=()=>act(ac,k.key);a.appendChild(b);
    });
    box.appendChild(d);
  });
}
</script></body></html>
